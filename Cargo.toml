[package]
name = "simple-blockchain-tool"
version = "0.1.0"
edition = "2024"

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
ed25519-dalek = {version = "2", features = ["rand_core"]}
rand = "0.8"
base64 = "0.22"

[profile.dev]
debug = false
incremental = false
